version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # Overriding the install step also skips Read the Docs' pip upgrade;
      # `--group` needs pip 25.1 or newer.
      - pip install --upgrade pip
      - pip install --group docs

mkdocs:
  configuration: mkdocs.yml
