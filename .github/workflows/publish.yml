name: Publish

# Builds wheels and the sdist on pull requests that change packaging, and
# publishes to PyPI and crates.io when a GitHub release is published.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - python/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Check the version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag, Cargo.toml, and CHANGELOG.md agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "medrs") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry for $version"
            exit 1
          fi

  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, free-threaded: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, free-threaded: true }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, free-threaded: true }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64, free-threaded: false }
          - { name: windows-x64, runner: windows-latest, target: x64, free-threaded: true }
    steps:
      - uses: actions/checkout@v5
      # The abi3 wheel covers every CPython >= 3.10 except free-threaded
      # builds, which need a wheel of their own.
      - uses: actions/setup-python@v6
        id: free-threaded
        if: matrix.free-threaded && runner.os != 'Linux'
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist
      - name: Build the free-threaded wheel
        if: matrix.free-threaded
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: >-
            --release --locked --out dist
            -i ${{ runner.os == 'Linux' && 'python3.14t' || steps.free-threaded.outputs.python-path }}
      - name: Import the abi3 wheel
        if: matrix.name != 'macos-x86_64'
        run: |
          python -m pip install numpy
          python -m pip install --no-index --find-links dist medrs
          python -c "import medrs, numpy; print(medrs.NiftiImage(numpy.zeros((2, 3, 4))))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and import a wheel from the sdist
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import medrs, numpy; print(medrs.NiftiImage(numpy.zeros((2, 3, 4))))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medrs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: Publish to crates.io
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p medrs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
