name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # mypy checks against the running Python; use the oldest supported one.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      # Pinned so that new lints arrive in deliberate toolchain bumps.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --exclude medrs-python --locked
      - run: cargo test --lib --locked
      - name: Run the example
        run: cargo run --example preprocess --locked -- tests/fixtures/mprage_img.nii.gz "$RUNNER_TEMP/out.nii.gz"

  msrv:
    name: Rust 1.83 (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.14t" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin --group test
      - name: Build and install medrs
        run: |
          maturin build --locked --out dist -i python
          python -m pip install --no-index --find-links dist medrs
      - run: pytest
      - name: Check the type stubs against the extension
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install --group lint
          python -m mypy.stubtest medrs._medrs --mypy-config-file pyproject.toml
      - name: Run the examples
        run: |
          python examples/quick_start.py
          python examples/training_loader.py

  integrations:
    name: PyTorch, MONAI, and JAX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install maturin monai jax ml_dtypes --group test
      - name: Build and install medrs
        run: |
          maturin build --locked --out dist -i python
          python -m pip install --no-index --find-links dist medrs
      - run: pytest
      - run: python examples/training_loader.py
