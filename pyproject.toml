[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "medrs"
dynamic = ["version"]
description = "Fast medical image I/O, transforms, and training patch loading"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Liam Chalcroft", email = "liam.chalcroft.20@ucl.ac.uk" }]
requires-python = ">=3.10"
keywords = ["medical-imaging", "nifti", "neuroimaging", "deep-learning", "pytorch", "monai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
monai = ["monai>=1.3"]
test = ["pytest>=8", "nibabel>=5"]

[project.urls]
Repository = "https://github.com/liamchalcroft/med-rs"
Documentation = "https://github.com/liamchalcroft/med-rs/tree/main/docs"
Changelog = "https://github.com/liamchalcroft/med-rs/blob/main/CHANGELOG.md"

[project.scripts]
medrs = "medrs.cli:main"

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "medrs._medrs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["medrs"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/medrs"]

[[tool.mypy.overrides]]
module = ["monai.*"]
ignore_missing_imports = true
