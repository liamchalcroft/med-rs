[package]
name = "medrs"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
description = "Fast medical image I/O, transforms, and training patch loading (NIfTI, crop-first reads, parallel gzip)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liamchalcroft/med-rs"
documentation = "https://docs.rs/medrs"
authors = ["Liam Chalcroft <liam.chalcroft.20@ucl.ac.uk>"]
keywords = ["medical-imaging", "nifti", "neuroimaging", "deep-learning", "mri"]
categories = ["science", "encoding", "multimedia::images"]
readme = "README.md"
include = ["/src", "/benches", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
bytemuck = { version = "1.19", features = ["extern_crate_alloc"] }
byteorder = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-ng"] }
gzp = { version = "2.0.4", default-features = false, features = ["deflate_zlib_ng"] }
half = { version = "2.4", features = ["bytemuck"] }
libdeflater = "1.25"
memmap2 = "0.9.11"
ndarray = "0.16"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1.10"
thiserror = "2.0"
zstd = { version = "0.13", optional = true }

[dev-dependencies]
criterion = "0.7"
proptest = "1.5"
tempfile = "3.14"

[features]
jvol = ["dep:zstd"]

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "io"
harness = false

[[bench]]
name = "transforms"
harness = false

[lints]
workspace = true

[workspace]
members = [".", "python"]
resolver = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric code converts between integer and float types on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Exact float comparisons are intentional (sentinels such as a zero slope).
float_cmp = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
