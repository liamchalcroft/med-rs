[package]
name = "medrs-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_medrs"
crate-type = ["cdylib"]

[dependencies]
half = "2.4"
medrs = { path = "..", features = ["jvol"] }
ndarray = "0.16"
numpy = { version = "0.29", features = ["half"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rand = "0.10"
rand_chacha = "0.9"

[lints]
workspace = true
